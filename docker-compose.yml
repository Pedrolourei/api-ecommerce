networks:
  ecommerce-net:
    driver: bridge

services:
  users-db:
    image: mongo:6
    container_name: users_mongo_db
    ports: ["27018:27017"]
    volumes: [users-data:/data/db]
    networks:
      - ecommerce-net
    command: --replSet rs0 
  products-db:
    image: mongo:6
    container_name: products_mongo_db
    ports: ["27019:27017"]
    volumes: [products-data:/data/db]
    networks:
      - ecommerce-net
    command: --replSet rs0 
  orders-db:
    image: mongo:6
    container_name: orders_mongo_db
    ports: ["27020:27017"]
    volumes: [orders-data:/data/db]
    networks:
      - ecommerce-net
    command: --replSet rs0 
  payments-db:
    image: mongo:6
    container_name: payments_mongo_db
    ports: ["27021:27017"]
    volumes: [payments-data:/data/db]
    networks:
      - ecommerce-net
    command: --replSet rs0 

  users-service:
    build: ./users-service 
    container_name: users_api
    ports: ["3001:3001"]
    volumes: 
      - ./users-service:/app
      - /app/node_modules
    depends_on: [users-db]
    environment:
      - DATABASE_URL=mongodb://users-db:27017/users_db?replicaSet=rs0
    command: sh -c "./wait-for-it.sh users-db:27017 -- npx prisma generate && npx prisma db push --accept-data-loss && npx nodemon server.js"
    networks:
      - ecommerce-net
  products-service:
    build: ./products-service
    container_name: products_api
    ports: ["3002:3002"]
    volumes: 
      - ./products-service:/app
      - /app/node_modules
    depends_on: [products-db]
    environment:
      - DATABASE_URL=mongodb://products-db:27017/products_db?replicaSet=rs0
    command: sh -c "./wait-for-it.sh products-db:27017 -- npx prisma generate && npx prisma db push --accept-data-loss && npx nodemon server.js"
    networks:
      - ecommerce-net
  orders-service:
    build: ./orders-service
    container_name: orders_api
    ports: ["3003:3003"]
    volumes: 
      - ./orders-service:/app
      - /app/node_modules
    depends_on: [orders-db, products-service]
    environment:
      - DATABASE_URL=mongodb://orders-db:27017/orders_db?replicaSet=rs0
      - PRODUCTS_SERVICE_URL=http://products-service:3002
    command: sh -c "./wait-for-it.sh orders-db:27017 -- npx prisma generate && npx prisma db push --accept-data-loss && npx nodemon server.js"
    networks:
      - ecommerce-net
      
  payments-service:
    build: ./payments-service
    container_name: payments_api
    ports: ["3004:3004"]
    volumes: 
      - ./payments-service:/app
      - /app/node_modules
    depends_on: [payments-db, orders-service, notifications-service]
    environment:
      - DATABASE_URL=mongodb://payments-db:27017/payments_db?replicaSet=rs0
      - ORDERS_SERVICE_URL=http://orders-service:3003
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3005
    command: sh -c "./wait-for-it.sh payments-db:27017 -- npx prisma generate && npx prisma db push --accept-data-loss && npx nodemon server.js"
    networks:
      - ecommerce-net
  notifications-service:
    build: ./notifications-service
    container_name: notifications_api
    ports: ["3005:3005"]
    volumes: 
      - ./notifications-service:/app
      - /app/node_modules
    command: sh -c "npx nodemon server.js" 
    networks:
      - ecommerce-net

volumes:
  users-data:
  products-data:
  orders-data:
  payments-data: